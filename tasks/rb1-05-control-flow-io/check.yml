# 課題 5。judge は設計文書「Ruby 基礎」§5 の「書き写し」の行
# （確認課題はデバッグ型なので、確認課題テストの judge は exercise_test を使う）。
task: rb1-05-control-flow-io
title: 制御構造とスクリプトの入出力
format: 書き写し（確認課題はデバッグ型）
submission_dir: rb1-05-control-flow-io

judges:
  - id: copy-run
    type: copy_run
    name: 写しの実行
    submission: control_flow_and_io_test.rb

  - id: copy-assertions
    type: assertion_count
    name: 写しのアサーション数
    submission: control_flow_and_io_test.rb
    min: 14
    runs_min: 11

  - id: copy-format
    type: rubocop
    name: 写しの書式（RuboCop）
    submission_paths:
      - control_flow_and_io_test.rb

  - id: why
    type: why_diff
    name: why.md が雛形と差分あり
    template: why.md
    submission: why.md

  - id: exercise
    type: exercise_test
    name: 確認課題テスト
    test: exercise/test/line_report_test.rb
    load_paths:
      - exercise/lib
    requires:
      - exercise/lib/line_report.rb
