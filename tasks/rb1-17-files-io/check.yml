# 書き写し課題。judge の構成は docs/check-yml.md の「形式別のひな型」を参照。
task: rb1-17-files-io
title: ファイルとディレクトリ
format: 書き写し
submission_dir: rb1-17-files-io

judges:
  - id: copy-check
    type: exercise_test
    name: 写しの照合
    test: copy_test/files_test.rb
    load_paths:
      - .
    requires:
      - files.rb

  - id: copy-format
    type: rubocop
    name: 写しの書式（RuboCop）
    submission_paths:
      - files.rb

  - id: why
    type: why_diff
    name: why.md が雛形と差分あり
    template: why.md
    submission: why.md

  - id: exercise
    type: exercise_test
    name: 確認課題テスト
    test: exercise/test/text_store_test.rb
    load_paths:
      - exercise/lib
    requires:
      - exercise/lib/text_store.rb
