# 課題 10。judge は設計文書「Ruby 基礎」§5 の「書き写し」の行。
task: rb1-10-classes-objects
title: クラスとオブジェクト
format: 書き写し
submission_dir: rb1-10-classes-objects

judges:
  - id: copy-check
    type: exercise_test
    name: 写しの照合
    test: copy_test/classes_and_objects_test.rb
    load_paths:
      - .
    requires:
      - classes_and_objects.rb

  - id: copy-format
    type: rubocop
    name: 写しの書式（RuboCop）
    submission_paths:
      - classes_and_objects.rb

  - id: why
    type: why_diff
    name: why.md が雛形と差分あり
    template: why.md
    submission: why.md

  - id: exercise
    type: exercise_test
    name: 確認課題テスト
    test: exercise/test/temperature_test.rb
    load_paths:
      - exercise/lib
    requires:
      - exercise/lib/temperature.rb
