# 書き写し課題。judge の構成は docs/check-yml.md の「形式別のひな型」を参照。
# 確認課題は lib と exe の 2 つを置く。exe は load_paths に足してテスト側から探す。
task: rb1-19-optparse-executable
title: 実行できる Ruby ファイルと OptionParser
format: 書き写し
submission_dir: rb1-19-optparse-executable

judges:
  - id: copy-check
    type: exercise_test
    name: 写しの照合
    test: copy_test/optparse_basics_test.rb
    load_paths:
      - .
    requires:
      - optparse_basics.rb
      - lib/greeter.rb
      - exe/greet

  - id: copy-format
    type: rubocop
    name: 写しの書式（RuboCop）
    submission_paths:
      - optparse_basics.rb
      - lib/greeter.rb

  - id: why
    type: why_diff
    name: why.md が雛形と差分あり
    template: why.md
    submission: why.md

  - id: exercise
    type: exercise_test
    name: 確認課題テスト
    test: exercise/test/counter_test.rb
    load_paths:
      - exercise/lib
      - exercise/exe
    requires:
      - exercise/lib/counter.rb
      - exercise/exe/count
