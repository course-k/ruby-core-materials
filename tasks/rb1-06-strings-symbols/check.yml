# 課題 6。judge は設計文書「Ruby 基礎」§5 の「書き写し」の行。
task: rb1-06-strings-symbols
title: 文字列と Symbol
format: 書き写し
submission_dir: rb1-06-strings-symbols

judges:
  - id: copy-run
    type: copy_run
    name: 写しの実行
    submission: strings_and_symbols_test.rb

  - id: copy-assertions
    type: assertion_count
    name: 写しのアサーション数
    submission: strings_and_symbols_test.rb
    min: 30
    runs_min: 13

  - id: copy-format
    type: rubocop
    name: 写しの書式（RuboCop）
    submission_paths:
      - strings_and_symbols_test.rb

  - id: why
    type: why_diff
    name: why.md が雛形と差分あり
    template: why.md
    submission: why.md

  - id: exercise
    type: exercise_test
    name: 確認課題テスト
    test: exercise/test/normalizer_test.rb
    load_paths:
      - exercise/lib
    requires:
      - exercise/lib/normalizer.rb
