# 課題 6。judge は設計文書「Ruby 基礎」§5 の「書き写し」の行。
task: rb1-06-strings-symbols
title: 文字列と Symbol
format: 書き写し
submission_dir: rb1-06-strings-symbols

judges:
  - id: copy-check
    type: exercise_test
    name: 写しの照合
    test: copy_test/strings_and_symbols_test.rb
    load_paths:
      - .
    requires:
      - strings_and_symbols.rb

  - id: copy-format
    type: rubocop
    name: 写しの書式（RuboCop）
    submission_paths:
      - strings_and_symbols.rb

  - id: why
    type: why_diff
    name: why.md が雛形と差分あり
    template: why.md
    submission: why.md

  - id: exercise
    type: exercise_test
    name: 確認課題テスト
    test: exercise/test/normalizer_test.rb
    load_paths:
      - exercise/lib
    requires:
      - exercise/lib/normalizer.rb
