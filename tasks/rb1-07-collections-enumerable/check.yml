# 課題 7。judge は設計文書「Ruby 基礎」§5 の「書き写し」の行のうち、
# 確認課題が出力予測型なので確認課題テストの代わりに predict を 2 本並べる。
task: rb1-07-collections-enumerable
title: Array / Hash / Range と Enumerable
format: 書き写し（確認課題は出力予測型）
submission_dir: rb1-07-collections-enumerable

judges:
  - id: copy-check
    type: exercise_test
    name: 写しの照合
    test: copy_test/collections_and_enumerable_test.rb
    load_paths:
      - .
    requires:
      - collections_and_enumerable.rb

  - id: copy-format
    type: rubocop
    name: 写しの書式（RuboCop）
    submission_paths:
      - collections_and_enumerable.rb

  - id: why
    type: why_diff
    name: why.md が雛形と差分あり
    template: why.md
    submission: why.md

  - id: exercise
    type: exercise_test
    name: 確認課題テスト
    test: exercise/test/feed_digest_test.rb
    load_paths:
      - exercise/lib
    requires:
      - exercise/lib/feed_digest.rb

  - id: predict-01
    type: predict
    name: 出力予測 01
    source: predict/01.rb
    expected: predict/01.txt

  - id: predict-02
    type: predict
    name: 出力予測 02
    source: predict/02.rb
    expected: predict/02.txt
